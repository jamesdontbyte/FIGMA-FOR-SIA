<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loc8 · Role/Commuter/NearestJeepney — Motion Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ==========================================================================
       DESIGN.md tokens (mapped to CSS custom properties — zero hardcoded colors)
       ========================================================================== */
    :root {
      /* 2.1 Core colors */
      --bg-default: #FFFFFF;
      --bg-app: #F1F1F2;
      --bg-subtle: #F7F8FA;
      --bg-muted: #F1F3F6;
      --bg-auth-hero: #0A0A0A;
      --bg-mascot-band: #262B35;
      --border-default: #E6E9EE;
      --border-card-subtle: #0000000A;
      --border-strong: #D3D8DF;
      --text-primary: #0F1115;
      --text-secondary: #5F6877;
      --text-tertiary: #8A92A0;
      --text-inverse: #FFFFFF;
      --primary-default: #0A0A0A;
      --primary-pressed: #262B35;
      --primary-disabled: #D3D8DF;

      /* 2.2 Accent & 2.6 App-specific status */
      --accent-default: #1F6FEB;
      --accent-pressed: #1859C2;
      --accent-tint: #E8F1FE;
      --status-live: #2E9E5B;
      --status-weak: #F5A524;
      --status-lost: #E5484D;
      --status-stale: #8A92A080;

      /* 3. Typography */
      --font-sans: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --type-display-size: 40px;
      --type-display-line: 48px;
      --type-display-weight: 800;

      --type-h3-size: 18px;
      --type-h3-line: 26px;
      --type-h3-weight: 600;

      --type-card-title-size: 13px;
      --type-card-title-line: 18px;
      --type-card-title-weight: 500;

      --type-body-size: 14px;
      --type-body-line: 20px;
      --type-body-weight: 400;

      --type-caption-size: 12px;
      --type-caption-line: 16px;
      --type-caption-weight: 500;

      --type-mono-tag-size: 10px;
      --type-mono-tag-line: 14px;
      --type-mono-tag-weight: 500;
      --type-mono-tag-tracking: 0.02em;

      --type-mono-body-size: 11px;
      --type-mono-body-line: 15px;
      --type-mono-body-weight: 500;
      --type-mono-body-tracking: -0.01em;

      /* 4.1 Spacing, sizes & layout */
      --space-0: 0px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-10: 40px;

      --layout-touch-min: 44px;
      --size-home-content-w: 361px;
      --size-dot-xs: 6px;
      --size-dot-sm: 8px;
      --size-chip-h: 28px;
      --size-btn-sm-h: 40px;
      --stroke-hairline: 1px;

      /* 4.2 Radius */
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-xl: 24px;
      --radius-pill: 999px;

      /* 4.3 Elevation */
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.04);

      /* Stage aliases mapped directly to Loc8 design tokens */
      --stage-bg: var(--bg-app);
      --stage-surface: var(--bg-default);
      --stage-fg: var(--text-primary);
      --stage-muted: var(--text-secondary);
      --stage-tertiary: var(--text-tertiary);
      --stage-border: var(--border-strong);
      --stage-accent: var(--primary-default);
      --stage-on-accent: var(--text-inverse);
      --chip: var(--bg-muted);
      --chip-hover: var(--border-default);
      --dot-off: var(--border-strong);
      --live: var(--status-live);

      /* @motion
      [ETA and seat count] number pop-in
      --digit-dur: Duration
      --digit-distance: Distance
      --digit-stagger: Stagger
      more --digit-exit-dur: Exit duration
      more --digit-enter-delay: Enter delay
      more --digit-exit-distance: Exit distance
      more --digit-blur: Blur
      more --digit-lift: Lift
      more --digit-start-scale: Start scale
      more --digit-peak: Peak scale
      [Route chip slide] selection pill
      --tab-dur: Duration
      --tab-ease: Easing
      [Card enter] card contents
      --enter-dur: Duration
      --enter-distance: Distance
      --enter-stagger: Stagger
      more [Route data crossfade] id and next stop
      --soft-dur: Duration
      --soft-blur: Blur
      more [Seat dots] fill in and change
      --dot-dur: Duration
      --dot-stagger: Stagger
      --dot-pop: Pop scale
      more [Seat line swap] count and Full
      --text-swap-dur: Duration
      --text-swap-translate-y: Distance
      --text-swap-blur: Blur
      --text-swap-ease: Easing
      more [Live dot] pulse
      --pulse-dur: Duration
      more [Button press] buttons and chips
      --press-scale: Scale
      --press-dur: Duration
      --ease-smooth-out: Easing
      */
      --digit-dur: 600ms;
      --digit-exit-dur: 155ms;
      --digit-enter-delay: 50ms;
      --digit-stagger: 40ms;
      --digit-distance: 0.52em;
      --digit-exit-distance: 0.52em;
      --digit-blur: max(0.067em, 0.171em - 2.1px);
      --digit-lift: 0.125em;
      --digit-start-scale: 0.7;
      --digit-peak: 1.03;
      --text-swap-dur: 150ms;
      --text-swap-translate-y: 4px;
      --text-swap-blur: 2px;
      --text-swap-ease: ease-in-out;
      --tab-dur: 250ms;
      --tab-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --enter-dur: 500ms;
      --enter-distance: 8px;
      --enter-stagger: 70ms;
      --soft-dur: 200ms;
      --soft-blur: 2px;
      --dot-dur: 250ms;
      --dot-stagger: 30ms;
      --dot-pop: 1.6;
      --pulse-dur: 2000ms;
      --press-scale: 0.97;
      --press-dur: 150ms;
      --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--stage-bg);
      color: var(--stage-fg);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-5);
      padding: var(--space-6) var(--space-0);
    }

    /* ==========================================================================
       Card surface — matches Figma Role/Commuter/NearestJeepney (361 × 320)
       ========================================================================== */
    .card {
      width: 100%;
      max-width: var(--size-home-content-w);
      box-sizing: border-box;
      padding: var(--space-4);
      border-radius: var(--radius-xl);
      background: var(--stage-surface);
      color: var(--stage-fg);
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      font-family: var(--font-sans);
      font-size: var(--type-card-title-size);
      line-height: var(--type-card-title-line);
      font-weight: var(--type-body-weight);
    }

    :where(.card) :is(button) {
      font: inherit;
      color: inherit;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      margin: 0;
    }

    :where(.card) :is(h2, p) {
      margin: 0;
    }

    /* Header: Role/Commuter/CardHeader (Tone=Live) */
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
      min-height: var(--space-5);
    }

    .head-l {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-width: 0;
    }

    .live {
      position: relative;
      width: var(--size-dot-xs);
      height: var(--size-dot-xs);
      border-radius: 50%;
      background: var(--live);
      flex: none;
    }

    .live::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--live);
      animation: pulse var(--pulse-dur) var(--ease-smooth-out) infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.5; }
      70%, 100% { transform: scale(2.6); opacity: 0; }
    }

    .title {
      font-family: var(--font-sans);
      font-size: var(--type-card-title-size);
      line-height: var(--type-card-title-line);
      font-weight: var(--type-card-title-weight);
      color: var(--stage-muted);
      white-space: nowrap;
    }

    .head-meta {
      font-family: var(--font-mono);
      font-size: var(--type-mono-tag-size);
      line-height: var(--type-mono-tag-line);
      font-weight: var(--type-mono-tag-weight);
      letter-spacing: var(--type-mono-tag-tracking);
      color: var(--stage-tertiary);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Staggered card rise-in */
    .rise {
      animation: rise var(--enter-dur) var(--ease-smooth-out) both;
      animation-delay: calc(var(--enter-stagger) * var(--i, 0));
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(var(--enter-distance));
        filter: blur(2px);
      }
    }

    /* Route chips: Badge/Route instances + sliding black primary/default Indicator */
    .chips {
      position: relative;
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip-ind {
      position: absolute;
      top: 0;
      left: 0;
      height: var(--size-chip-h);
      width: 0;
      border-radius: var(--radius-pill);
      background: var(--stage-accent);
      z-index: 1;
      pointer-events: none;
      transition: transform var(--tab-dur) var(--tab-ease), width var(--tab-dur) var(--tab-ease);
    }

    .chip-ind.no-anim {
      transition: none;
    }

    .chip {
      --press-scale: 0.97;
      position: relative;
      flex: none;
      height: var(--size-chip-h);
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-pill);
      background: var(--chip);
      font-family: var(--font-sans);
      font-size: var(--type-caption-size);
      line-height: var(--type-caption-line);
      font-weight: var(--type-caption-weight);
      color: var(--stage-muted);
      max-width: 148px;
      transition:
        transform var(--press-dur) var(--ease-smooth-out),
        color var(--tab-dur) var(--tab-ease),
        background-color 120ms ease;
    }

    /* Extend hit area to 44px minimum touch target without changing visual 28px chip height */
    .chip::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc((var(--size-chip-h) - var(--layout-touch-min)) / 2);
      height: var(--layout-touch-min);
    }

    .chip span {
      position: relative;
      z-index: 2;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chip[aria-pressed="true"] {
      color: var(--stage-on-accent);
    }

    .chip:is(:active, .is-pressed) {
      transform: scale(var(--press-scale));
    }

    /* ETA Block: 40/48 800 display + MIN mono-tag + Arriving swap + Sub line */
    .eta-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .eta-slot {
      display: grid;
      align-items: baseline;
      justify-items: start;
      min-height: var(--type-display-line);
    }

    .eta,
    .eta-arriving {
      grid-area: 1 / 1;
    }

    .eta {
      display: inline-flex;
      align-items: baseline;
      gap: var(--space-2);
    }

    .eta-num {
      font-family: var(--font-sans);
      font-size: var(--type-display-size);
      line-height: var(--type-display-line);
      font-weight: var(--type-display-weight);
      color: var(--stage-fg);
      font-variant-numeric: tabular-nums;
      min-width: 0.65ch;
    }

    .eta-unit {
      font-family: var(--font-mono);
      font-size: var(--type-mono-tag-size);
      line-height: var(--type-mono-tag-line);
      font-weight: var(--type-mono-tag-weight);
      letter-spacing: var(--type-mono-tag-tracking);
      color: var(--stage-muted);
      text-transform: uppercase;
    }

    .eta-arriving {
      align-self: center;
      font-family: var(--font-sans);
      font-size: var(--type-h3-size);
      line-height: var(--type-h3-line);
      font-weight: var(--type-h3-weight);
      color: var(--stage-fg);
    }

    .sub {
      font-family: var(--font-mono);
      font-size: var(--type-mono-body-size);
      line-height: var(--type-mono-body-line);
      font-weight: var(--type-mono-body-weight);
      letter-spacing: var(--type-mono-body-tracking);
      color: var(--stage-muted);
    }

    .t-soft {
      transition: opacity var(--soft-dur) ease-in-out, filter var(--soft-dur) ease-in-out;
    }

    .t-soft.is-exit {
      opacity: 0;
      filter: blur(var(--soft-blur));
    }

    /* Seats Block: 20-dot grid (10 per row, 8px dot, 8px gap), right-aligned */
    .seats {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--space-2);
    }

    .dots {
      display: grid;
      grid-template-columns: repeat(10, var(--size-dot-sm));
      gap: var(--space-2);
      justify-content: end;
    }

    .dot {
      width: var(--size-dot-sm);
      height: var(--size-dot-sm);
      border-radius: 50%;
      background: var(--dot-off);
      transition: background-color var(--dot-dur) var(--ease-smooth-out);
    }

    .dot.is-free {
      background: var(--stage-fg);
    }

    .dot.is-intro {
      animation: dot-in 300ms var(--ease-smooth-out) both;
      animation-delay: calc(400ms + var(--dot-stagger) * var(--n, 0));
    }

    .dot.is-changed {
      animation: dot-pop var(--dot-dur) var(--ease-smooth-out);
    }

    @keyframes dot-in {
      from {
        opacity: 0;
        transform: scale(0);
      }
    }

    @keyframes dot-pop {
      40% {
        transform: scale(var(--dot-pop));
      }
    }

    .count {
      display: grid;
      justify-items: end;
      text-align: right;
      width: 100%;
    }

    .count-line {
      grid-area: 1 / 1;
      font-family: var(--font-mono);
      font-size: var(--type-mono-body-size);
      line-height: var(--type-mono-body-line);
      font-weight: var(--type-mono-body-weight);
      letter-spacing: var(--type-mono-body-tracking);
      color: var(--stage-fg);
      font-variant-numeric: tabular-nums;
    }

    .tiny {
      font-family: var(--font-mono);
      font-size: var(--type-mono-tag-size);
      line-height: var(--type-mono-tag-line);
      font-weight: var(--type-mono-tag-weight);
      letter-spacing: var(--type-mono-tag-tracking);
      color: var(--stage-tertiary);
      text-transform: uppercase;
      text-align: right;
      width: 100%;
    }

    /* Actions: Track Jeepney (176.5px flex) + Alert me / Alerts on (144.5px flex) */
    .actions {
      display: flex;
      gap: var(--space-2);
    }

    .btn {
      --press-scale: 0.97;
      position: relative;
      height: var(--size-btn-sm-h);
      border-radius: var(--radius-pill);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      font-family: var(--font-sans);
      font-size: var(--type-body-size);
      line-height: var(--type-body-line);
      font-weight: var(--type-body-weight);
      white-space: nowrap;
      transition:
        transform var(--press-dur) var(--ease-smooth-out),
        background-color 150ms var(--ease-smooth-out),
        box-shadow 150ms var(--ease-smooth-out),
        opacity 120ms ease;
    }

    /* Extend hit area to 44px minimum touch target */
    .btn::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: calc((var(--size-btn-sm-h) - var(--layout-touch-min)) / 2);
      height: var(--layout-touch-min);
    }

    .btn:is(:active, .is-pressed) {
      transform: scale(var(--press-scale));
    }

    .btn-primary {
      flex: 0 0 176.5px;
      min-width: 0;
      background: var(--stage-accent);
      color: var(--stage-on-accent);
    }

    /* Alert button: Default Outline when off, bg/muted borderless "Alerts on" when on (matches Figma Alert On Layer) */
    .btn-outline {
      flex: 0 0 144.5px;
      min-width: 0;
      background: var(--stage-surface);
      color: var(--stage-fg);
      box-shadow: inset 0 0 0 var(--stroke-hairline) var(--stage-border);
    }

    .btn-outline[aria-pressed="true"] {
      background: var(--chip);
      box-shadow: inset 0 0 0 0 transparent;
    }

    .btn:focus-visible,
    .chip:focus-visible,
    .ctrl-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 2px var(--stage-surface), 0 0 0 4px var(--stage-accent);
    }

    @media (hover: hover) {
      .chip:hover {
        background: var(--chip-hover);
      }
      .btn-outline:hover {
        background: var(--chip);
      }
      .btn-primary:hover {
        opacity: 0.92;
      }
    }

    /* ==========================================================================
       transitions.dev digit roll & text swap keyframes (exact)
       ========================================================================== */
    .t-digit-group {
      display: inline-flex;
      align-items: baseline;
    }

    .t-digit-slot {
      position: relative;
      display: inline-block;
    }

    .t-digit-old {
      position: absolute;
      inset: 0;
      text-align: center;
      pointer-events: none;
    }

    .t-digit {
      display: inline-block;
      will-change: transform, opacity, filter;
    }

    .t-digit-group.is-animating .t-digit {
      animation: t-digit-in var(--digit-dur) linear both;
      animation-delay: calc(var(--digit-stagger) * var(--digit-i, 0) + var(--digit-enter-delay));
    }

    .t-digit-group.is-animating .t-digit-old {
      animation: t-digit-out var(--digit-exit-dur) linear both;
      animation-delay: calc(var(--digit-stagger) * var(--digit-i, 0));
    }

    .t-digit-group.is-animating [data-stagger="1"] { --digit-i: 1; }
    .t-digit-group.is-animating [data-stagger="2"] { --digit-i: 2; }

    .t-digit-group.is-animating .t-digit[data-same] {
      animation: none;
    }

<body>
  <main class="stage">
    <article class="card" aria-label="Nearest jeepney">
      <header class="head rise" style="--i:0">
        <div class="head-l">
          <span class="live" aria-hidden="true"></span>
          <h2 class="title">Nearest jeepney</h2>
        </div>
        <span class="head-meta" id="headMeta">5 ACTIVE · LIVE · 20S</span>
      </header>

      <div class="chips rise" style="--i:1" role="group" aria-label="Routes">
        <span class="chip-ind" aria-hidden="true"></span>
        <button class="chip" type="button" data-route="R1" aria-pressed="true"><span>R1 · Bugasong</span></button>
        <button class="chip" type="button" data-route="R2" aria-pressed="false"><span>R2 · San Jose</span></button>
        <button class="chip" type="button" data-route="R3" aria-pressed="false"><span>R3 · Patnongon</span></button>
      </div>

      <section class="eta-block rise" style="--i:2">
        <div class="eta-slot">
          <div class="eta t-text-swap" id="etaWrap">
            <span class="eta-num t-digit-group" id="eta" aria-live="polite">6</span>
            <span class="eta-unit">MIN</span>
          </div>
          <span class="eta-arriving t-text-swap is-exit" id="arrivingLine" aria-live="polite">Arriving</span>
        </div>
        <p class="sub t-soft" id="sub">J-014 · arriving Plaza</p>
      </section>

      <section class="seats rise" style="--i:3">
        <div class="dots" id="dots" role="img" aria-label="8 of 20 seats free"></div>
        <div class="count">
          <span class="count-line t-text-swap" id="countLine"><span class="t-digit-group" id="free">8</span> of <span id="capNum">20</span> seats free</span>
          <span class="count-line t-text-swap is-exit" id="fullLine">Full</span>
        </div>
        <p class="tiny" id="updatedLine">DRIVER-REPORTED · 2 MIN AGO</p>
      </section>

      <div class="actions rise" style="--i:4">
        <button class="btn btn-primary" type="button" id="trackBtn">Track Jeepney</button>
        <button class="btn btn-outline" type="button" id="alert" aria-pressed="false">
          <svg class="hi" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" aria-hidden="true">
            <path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
          </svg>
          <span id="alertLabel">Alert me</span>
        </button>
      </div>
    </article>

    <aside class="controls" aria-label="Motion test controls">
      <span class="controls-label">Motion test controls</span>
      <div class="controls-grid">
        <button class="ctrl-btn" type="button" id="ctrlMinus1">-1 min</button>
        <button class="ctrl-btn" type="button" id="ctrlPlus1">+1 min</button>
        <button class="ctrl-btn" type="button" id="ctrlToggleSeat">Toggle seat</button>
        <button class="ctrl-btn" type="button" id="ctrlFull">Full</button>
        <button class="ctrl-btn" type="button" id="ctrlArriving">Arriving</button>
        <button class="ctrl-btn" type="button" id="ctrlNextRoute">Next route</button>
        <button class="ctrl-btn" type="button" id="ctrlReducedMotion" aria-pressed="false">Reduced motion</button>
      </div>
    </aside>
  </main>

  <script>
    /* ==========================================================================
       CARD LOGIC (reusable API: setEta, setSeats, selectRoute, setAlert)

    (function () {
      function digits(el) {
        var current = el.textContent.replace(/\s+/g, '');
        return function (str) {
          str = String(str);
          if (str === current) return;
          var same = 0;
          while (same < current.length && same < str.length && current[same] === str[same]) same++;
          el.classList.remove('is-animating');
          el.replaceChildren();

            var fresh = document.createElement('span');
            fresh.className = 't-digit';
            fresh.textContent = ch;
            if (i < same || !/\d/.test(ch)) {
              fresh.dataset.same = '';
              el.appendChild(fresh);
              return;
            }
            var slot = document.createElement('span');
            slot.className = 't-digit-slot';
            var fe = str.length - 1 - i;
            if (fe === 1) slot.dataset.stagger = '1';

      var subEl = document.getElementById('sub');
      var dotsEl = document.getElementById('dots');
      var countLine = document.getElementById('countLine');
      var fullLine = document.getElementById('fullLine');
      var alertBtn = document.getElementById('alert');
      var alertLabel = document.getElementById('alertLabel');

      var ind = document.querySelector('.chip-ind');

      var rollEta = digits(etaEl);
      var rollFree = digits(freeEl);

      var dots = [];
      for (var i = 0; i < 20; i++) {
        var d = document.createElement('span');
        d.className = 'dot is-intro';
        d.style.setProperty('--n', i);
        dotsEl.appendChild(d);
        dots.push(d);
      }
      setTimeout(function () {
        dots.forEach(function (d) { d.classList.remove('is-intro'); });
      }, 400 + 20 * 30 + 400);

      var state = {
        selectedRouteId: 'R1',
        eta: 6,
        jeepneyId: 'J-014',
        stop: 'Plaza',
        seats: [],
        capacity: 20,
        alertOn: false,
        firstRender: true
      };

      function softMs() {
        if (document.documentElement.getAttribute('data-reduced-motion') === 'true') return 0;

        if (el.textContent === text) return;
        var ms = softMs();
        if (ms <= 0) {
          el.textContent = text;
          el.classList.remove('is-exit');
          return;
        }
        el.classList.add('is-exit');
        clearTimeout(el._softTimer);
        el._softTimer = setTimeout(function () {
          el.textContent = text;
          el.classList.remove('is-exit');
        }, ms);
      }

      function subText(jeepneyId, stop, eta) {
        return jeepneyId + ' · ' + (eta < 1 ? 'arriving now' : 'arriving ' + stop);
      }

      function moveInd(instant) {
        var activeChip = chips.find(function (c) {
          return c.getAttribute('data-route') === state.selectedRouteId;
        }) || chips[0];
        if (!activeChip) return;
        if (instant) ind.classList.add('no-anim');
        ind.style.width = activeChip.offsetWidth + 'px';
        ind.style.transform = 'translateX(' + activeChip.offsetLeft + 'px)';
        if (instant) {
          void ind.offsetWidth;
          ind.classList.remove('no-anim');
        }
      }

      function setEta(n, meta) {
        var val = Math.max(0, Number(n) || 0);
        state.eta = val;
        if (meta && meta.jeepneyId) state.jeepneyId = meta.jeepneyId;
        if (meta && meta.stop) state.stop = meta.stop;

        var arriving = val < 1;
        etaWrap.classList.toggle('is-exit', arriving);
        arrivingLine.classList.toggle('is-exit', !arriving);
        if (!arriving) {
          rollEta(String(Math.round(val)));
        }
        soft(subEl, subText(state.jeepneyId, state.stop, val));
      }

      function setSeats(arr, capacity) {
        var cap = Math.max(1, Math.min(20, Number(capacity) || (arr ? arr.length : 20) || 20));
        state.capacity = cap;
        capNumEl.textContent = String(cap);
        var list = (arr || []).slice(0, cap).map(Boolean);
        while (list.length < cap) list.push(false);
        state.seats = list;

        var freeCount = 0;
        for (var i = 0; i < 20; i++) {
          var d = dots[i];
          if (i >= cap) {
            d.style.display = 'none';
            continue;
          }
          d.style.display = '';
          var f = list[i];
          if (d.classList.contains('is-free') !== f) {
            d.classList.toggle('is-free', f);
            if (!state.firstRender) {
              d.classList.remove('is-changed');
              void d.offsetWidth;
              d.classList.add('is-changed');
              (function (dotNode) {
                clearTimeout(dotNode._popTimer);
                dotNode._popTimer = setTimeout(function () {
                  dotNode.classList.remove('is-changed');
                }, 400);
              })(d);
            }
          }
          if (f) freeCount++;
        }

        state.firstRender = false;
        rollFree(freeCount);
        dotsEl.setAttribute('aria-label', freeCount + ' of ' + cap + ' seats free');
        var full = freeCount === 0;
        countLine.classList.toggle('is-exit', full);
        fullLine.classList.toggle('is-exit', !full);
      }

      function setAlert(bool) {
        var next = Boolean(bool);
        state.alertOn = next;
        alertBtn.setAttribute('aria-pressed', String(next));
        alertLabel.textContent = next ? 'Alerts on' : 'Alert me';
      }

      var routeChangeHandler = null;
      function selectRoute(id, instant) {
        var targetChip = chips.find(function (c) { return c.getAttribute('data-route') === id; });
        if (!targetChip) return;
        state.selectedRouteId = id;
        chips.forEach(function (c) {
          c.setAttribute('aria-pressed', String(c.getAttribute('data-route') === id));
        });
        moveInd(Boolean(instant));
        if (typeof routeChangeHandler === 'function') {
          routeChangeHandler(id, Boolean(instant));
        }
      }

      chips.forEach(function (c) {
        c.addEventListener('click', function () {
          var id = c.getAttribute('data-route');
          if (id !== state.selectedRouteId) selectRoute(id, false);
        });
      });

      alertBtn.addEventListener('click', function () {
        setAlert(!state.alertOn);
      });

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { moveInd(true); });
      }
      window.addEventListener('resize', function () { moveInd(true); });

      window.setEta = setEta;
      window.setSeats = setSeats;
      window.selectRoute = selectRoute;
      window.setAlert = setAlert;
      window._cardInternal = {
        getState: function () { return state; },
        onRouteSelected: function (fn) { routeChangeHandler = fn; },
        moveInd: moveInd

    /* end touch press */

    /* ==========================================================================
       DEMO BLOCK (sample route data, 4s ETA timer, 5.5s seat flip timer, test bar)
       Keep separate from card logic — a real app calls setEta / setSeats / selectRoute / setAlert
       ========================================================================== */
    (function () {
      var routes = [
        {
          routeId: 'R1',
          eta: 6,
          base: 6,
          id: 'J-014',
          stop: 'Plaza',
          capacity: 20,
          seats: '10010110001001100010'
        },
        {
          routeId: 'R2',
          eta: 0,
          base: 3,
          id: 'J-021',
          stop: 'San Jose',
          capacity: 20,
          seats: '11011011010110101100'
        },
        {
          routeId: 'R3',
          eta: 10,
          base: 11,
          id: 'J-007',
          stop: 'Market',
          capacity: 20,
          seats: '00000000000000000000'
        }
      ].map(function (r) {
        r.s = r.seats.split('').map(function (c) { return c === '1'; });
        return r;
      });

      var curIndex = 0;

      function applyRoute(r) {
        window.setEta(r.eta, { jeepneyId: r.id, stop: r.stop });
        window.setSeats(r.s, r.capacity);
      }

      window._cardInternal.onRouteSelected(function (routeId) {
        var idx = routes.findIndex(function (r) { return r.routeId === routeId; });
        if (idx === -1) return;
        curIndex = idx;
        applyRoute(routes[curIndex]);
      });

      // Initial render
      applyRoute(routes[0]);
      window._cardInternal.moveInd(true);

      // Demo timer 1: ETA counts down by 1 every 4s and loops back to base
      setInterval(function () {
        var r = routes[curIndex];
        r.eta = r.eta <= 0 ? r.base : r.eta - 1;
        window.setEta(r.eta, { jeepneyId: r.id, stop: r.stop });
      }, 4000);

      // Demo timer 2: seats flip randomly every 5.5s
      setInterval(function () {
        var r = routes[curIndex];
        var k = Math.floor(Math.random() * r.capacity);
        r.s[k] = !r.s[k];
        window.setSeats(r.s, r.capacity);
      }, 5500);

      // Control bar buttons
      document.getElementById('ctrlMinus1').addEventListener('click', function () {
        var r = routes[curIndex];
        r.eta = Math.max(0, r.eta - 1);
        window.setEta(r.eta, { jeepneyId: r.id, stop: r.stop });
      });

      document.getElementById('ctrlPlus1').addEventListener('click', function () {
        var r = routes[curIndex];
        r.eta = r.eta + 1;
        window.setEta(r.eta, { jeepneyId: r.id, stop: r.stop });
      });

      document.getElementById('ctrlToggleSeat').addEventListener('click', function () {
        var r = routes[curIndex];
        var k = Math.floor(Math.random() * r.capacity);
        r.s[k] = !r.s[k];
        window.setSeats(r.s, r.capacity);
      });

      document.getElementById('ctrlFull').addEventListener('click', function () {
        var r = routes[curIndex];
        r.s = r.s.map(function () { return false; });
        window.setSeats(r.s, r.capacity);
      });

      document.getElementById('ctrlArriving').addEventListener('click', function () {
        var r = routes[curIndex];
        r.eta = 0;
        window.setEta(r.eta, { jeepneyId: r.id, stop: r.stop });
      });

      document.getElementById('ctrlNextRoute').addEventListener('click', function () {
        var nextIdx = (curIndex + 1) % routes.length;
        window.selectRoute(routes[nextIdx].routeId);
      });

      var rmBtn = document.getElementById('ctrlReducedMotion');
      rmBtn.addEventListener('click', function () {
        var active = document.documentElement.getAttribute('data-reduced-motion') === 'true';
        var next = !active;
        document.documentElement.setAttribute('data-reduced-motion', String(next));
        rmBtn.setAttribute('aria-pressed', String(next));
      });
    })();
  </script>
</body>
</html>
