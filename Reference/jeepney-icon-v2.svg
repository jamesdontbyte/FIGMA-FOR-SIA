  <!-- open-air window ribbon -->
  <path fill="#fff" d="M8 14 H70 Q72 14 72 16 V27 H8 Z"/>
  <!-- pillars -->
  <rect x="24" y="14" width="2.4" height="13" fill="#1E6FF0"/>
  <rect x="42" y="14" width="2.4" height="13" fill="#1E6FF0"/>
