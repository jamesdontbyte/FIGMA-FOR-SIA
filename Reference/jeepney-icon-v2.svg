<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 54" width="480" height="216" role="img" aria-label="Jeepney" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- body: rounded roof with overhang, front header, taller hood at mid-height, big front bumper -->
