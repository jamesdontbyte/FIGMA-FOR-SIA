  <rect x="112.5" y="35.5" width="4.5" height="1.4" rx=".7" fill="#fff"/>
  <circle cx="107" cy="27" r="3" fill="#fff"/>
  <!-- wheels -->
  <circle cx="22" cy="42" r="10.5" fill="#fff"/>
  <circle cx="94" cy="42" r="10.5" fill="#fff"/>
  <circle cx="22" cy="42" r="8.5" fill="#1E6FF0"/>
  <circle cx="94" cy="42" r="8.5" fill="#1E6FF0"/>
  <circle cx="22" cy="42" r="3" fill="#fff"/>
  <circle cx="94" cy="42" r="3" fill="#fff"/>
</svg>
