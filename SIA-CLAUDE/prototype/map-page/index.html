<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loc8 · Map page prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* =========================================================================
   Tokens. Names follow DESIGN.md. Raw values live only in this block.
   ========================================================================= */
:root {
  --bg-default: #FFFFFF;
  --bg-app: #F1F1F2;
  --bg-subtle: #F7F8FA;
  --bg-muted: #F1F3F6;
  --bg-strong: #D3D8DF;
  --text-primary: #0F1115;
  --text-secondary: #5F6877;
  --text-inverse: #FFFFFF;
  --primary-default: #0A0A0A;
  --primary-pressed: #262B35;
  --accent-default: #1F6FEB;
  --success-fill: #E3F5EA;  /* semantic/success-fill */
  --success-ink: #1E8E4F;   /* semantic/success-ink */
  --route-1: #1F6FEB;       /* R1 · Bugasong */
  --route-2: #F28C38;       /* R2 · San Jose */
  --route-3: #2E9E5B;       /* R3 · Patnongon */
  --scrim: rgba(0, 0, 0, 0.4);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;

  --layout-frame-width: 393px;
  --layout-frame-height: 852px;
  --layout-safe-bottom: 34px;
  --layout-touch-min: 44px;
  --size-nav-height: 64px;
  --size-content-width: 353px;
  --size-dot-sm: 8px;
  --size-timeline-line: 4px;
  --size-stop-dot: 12px;
  --size-stop-dot-end: 20px;
  --size-handle-w: 36px;
  --size-card-w: 320px;
  --size-card-h: 218px;
  --size-jeep-marker: 36px;   /* size/handle-w */

  --radius-sm: 12px; --radius-md: 16px; --radius-lg: 20px; --radius-xl: 24px; --radius-2xl: 28px; --radius-pill: 999px;

  --shadow-raised: 0 8px 24px rgba(15, 17, 21, 0.10);
  --shadow-soft: 0 4px 16px rgba(15, 17, 21, 0.06);

  --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
  --sheet-dur: 320ms;
  --ui-dur: 200ms;
  --press-scale: 0.97;
  --press-dur: 150ms;
  --route-tint-mix: 16%;
}

/* =========================================================================
   Page and phone frame
   ========================================================================= */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh; display: grid; place-items: center;
  background: var(--bg-subtle);
  font-family: var(--font-sans); color: var(--text-primary);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
:where(button) {
  font: inherit; color: inherit; padding: 0; margin: 0;
  border: 0;          /* reset the browser default, not a design border */
  background: none; cursor: pointer; text-align: left;
}
:where(button):focus-visible { outline: none; } /* focus is shown by fill change instead */
svg { display: block; flex: none; }
a { color: inherit; text-decoration: none; }

.phone {
  position: relative;
  width: var(--layout-frame-width); height: var(--layout-frame-height);
  background: var(--bg-app);
  border-radius: var(--radius-2xl);
  box-shadow: var(--shadow-raised);
  overflow: hidden;
}
@media (max-width: 430px) {
  body { display: block; }
  .phone { width: 100%; border-radius: 0; box-shadow: none; }
}

/* Route colors, shared by every element that needs one */
[data-route="r1"] { --rc: var(--route-1); }
[data-route="r2"] { --rc: var(--route-2); }
[data-route="r3"] { --rc: var(--route-3); }
[data-route] { --rc-tint: color-mix(in srgb, var(--rc) var(--route-tint-mix), var(--bg-default)); }

/* =========================================================================
   Map (MapLibre GL)
   ========================================================================= */
#map { position: absolute; inset: 0; z-index: 0; font-family: var(--font-sans); background: var(--bg-app); }
.maplibregl-canvas:focus, .maplibregl-map:focus { outline: none; }
.maplibregl-ctrl-attrib { font-size: 10px; line-height: 14px; }

/* Markers are buttons: MapLibre moves the outer element, visuals live on the inner one */
.marker { display: block; }
.marker:focus-visible > * { filter: brightness(0.85); }

/* Stop pin: ring marker made of two fills (route color + white core) */
.marker-stop { z-index: 1; }
.pin { position: relative; width: var(--size-stop-dot); height: var(--size-stop-dot); border-radius: 50%; background: var(--rc); transition: transform var(--ui-dur) var(--ease-smooth-out); }
.marker-stop::before { content: ""; position: absolute; inset: -16px; }          /* 44 px touch area */
.pin::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg-default); }
.pin.is-end { width: var(--size-stop-dot-end); height: var(--size-stop-dot-end); }
.pin.is-end::after { inset: 5px; }
.pin.is-selected::after { background: var(--rc); }   /* filled = selected */
.pin.is-selected { transform: scale(1.2); }

/* Stop callout: white label above the selected stop (from AssestRef/map stops.jpg) */
.callout-wrap { z-index: 3; pointer-events: none; }
.callout {
  position: relative;
  padding: var(--space-2) var(--space-3);
  background: var(--bg-default); border-radius: var(--radius-md);
  box-shadow: var(--shadow-raised);
  font-size: 14px; line-height: 20px; font-weight: 600; /* type/body, 600 */
  white-space: nowrap;
}
.callout::after {  /* tail */
  content: ""; position: absolute; left: 50%; top: 100%; margin-left: -6px;
  width: 12px; height: 7px; background: var(--bg-default);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}

/* Jeepney marker: Figma Map/Markers "Jeepney Live" (white 36 px circle, Icon/jeepney-v2), icon recolored to the route color */
.marker-jeep { z-index: 4; }
.jeep-pin {
  width: var(--size-jeep-marker); height: var(--size-jeep-marker);
  display: grid; place-items: center;
  border-radius: 50%; background: var(--bg-default); color: var(--rc);
  box-shadow: var(--shadow-soft);
  transition: transform var(--ui-dur) var(--ease-smooth-out);
}
.jeep-pin.is-active { transform: scale(1.2); }

/* =========================================================================
   Card deck (Card/Jeepney from Figma, 320 wide) as a swipe carousel
   ========================================================================= */
.deck {
  position: absolute; z-index: 2; left: 0; right: 0;
  bottom: calc(var(--layout-safe-bottom) + var(--space-3) + var(--size-nav-height) + var(--space-5) - var(--space-4));
  height: calc(var(--size-card-h) + 2 * var(--space-4));   /* room for the card shadow */
  display: flex; gap: var(--space-3);
  padding: var(--space-4) calc((var(--layout-frame-width) - var(--size-card-w)) / 2);
  overflow-x: auto; overscroll-behavior-x: contain;
  scroll-snap-type: x mandatory; scrollbar-width: none;
  touch-action: pan-x;
}
.deck::-webkit-scrollbar { display: none; }
.card {
  flex: none; width: var(--size-card-w); height: var(--size-card-h);
  scroll-snap-align: center; scroll-snap-stop: always;
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-4);
  background: var(--bg-default); border-radius: var(--radius-xl); box-shadow: var(--shadow-soft);
}
.card-top { display: flex; flex-direction: column; gap: var(--space-1); }
.card-row { display: flex; align-items: flex-start; justify-content: space-between; }
.chip {
  height: 24px; padding: 0 var(--space-3);
  display: inline-flex; align-items: center;
  border-radius: var(--radius-pill); background: var(--rc-tint);
  font-size: 12px; line-height: 16px; font-weight: 500; /* type/caption */
}
.eta-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.eta { font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; } /* type/body, 600 */
.status {
  height: 24px; padding: 0 var(--space-3);
  display: inline-flex; align-items: center; gap: var(--space-2);
  border-radius: var(--radius-pill); background: var(--success-fill); color: var(--success-ink);
  font-size: 12px; line-height: 16px; font-weight: 500;
}
.status::before { content: ""; width: var(--size-dot-sm); height: var(--size-dot-sm); border-radius: 50%; background: var(--success-ink); }
.card-dest { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } /* type/h3 */
.progress { display: flex; flex-direction: column; gap: var(--space-1); }
.track { position: relative; height: 14px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 4px; border-radius: var(--radius-pill); background: var(--bg-strong); }
.track-fill { position: absolute; left: 0; top: 5px; height: 4px; border-radius: var(--radius-pill); background: var(--rc); }
.track-dot { position: absolute; top: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--rc); }
.track-dot::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--bg-default); }
.caption { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-secondary); }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding-top: var(--space-1); }
.next { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.next-name { width: 195px; max-width: 100%; font-size: 14px; line-height: 20px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.see-more {
  flex: none; height: var(--layout-touch-min); padding: 0 var(--space-1);
  display: inline-flex; align-items: center; gap: var(--space-1);
  border-radius: var(--radius-md);
  color: var(--accent-default);
  font-size: 14px; line-height: 20px; font-weight: 600;
  transition: background-color var(--ui-dur) ease-out, transform var(--press-dur) var(--ease-smooth-out);
}
.see-more:focus-visible { background: var(--bg-muted); }

/* =========================================================================
   Bottom nav (Nav/Commuter), Map active
   ========================================================================= */
.nav {
  position: absolute; z-index: 3; left: 50%;
  bottom: calc(var(--layout-safe-bottom) + var(--space-3));
  transform: translateX(-50%);
  width: var(--size-content-width); height: var(--size-nav-height);
  display: flex; gap: var(--space-3);
}
.nav-pill {
  flex: 1; display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-1);
  background: var(--bg-default); border-radius: var(--radius-pill); box-shadow: var(--shadow-raised);
}
.tab {
  width: var(--layout-touch-min); height: 56px; display: grid; place-items: center;
  color: var(--text-secondary); border-radius: var(--radius-pill);
}
.tab.is-active {
  width: auto; padding: 0 var(--space-4);
  display: flex; align-items: center; gap: var(--space-2);
  background: var(--primary-default); color: var(--text-inverse);
  font-size: 12px; line-height: 16px; font-weight: 600;
}
.action {
  width: var(--size-nav-height); height: var(--size-nav-height); flex: none;
  display: grid; place-items: center;
  border-radius: var(--radius-pill); background: var(--primary-default); color: var(--text-inverse);
  box-shadow: var(--shadow-raised);
  transition: background-color var(--ui-dur) ease-out, transform var(--press-dur) var(--ease-smooth-out);
}
.action:focus-visible { background: var(--primary-pressed); }

/* =========================================================================
   "See more" bottom sheet (DESIGN.md 6.4)
   ========================================================================= */
.scrim {
  position: absolute; inset: 0; z-index: 5;
  background: var(--scrim); opacity: 0; pointer-events: none;
  transition: opacity var(--sheet-dur) var(--ease-smooth-out);
}
.phone[data-sheet="open"] .scrim { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; z-index: 6; left: 0; right: 0; bottom: 0;
  max-height: 640px; display: flex; flex-direction: column;
  padding-bottom: var(--layout-safe-bottom);
  background: var(--bg-default);
  border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
  box-shadow: var(--shadow-raised);
  transform: translateY(100%);
  transition: transform var(--sheet-dur) var(--ease-smooth-out);
}
.phone[data-sheet="open"] .sheet { transform: none; }
.handle { width: var(--size-handle-w); height: 4px; margin: var(--space-2) auto 0; border-radius: var(--radius-pill); background: var(--bg-strong); }
.sheet-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-5) var(--space-3); }
.sheet-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sheet-title h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 600; }
.mono-tag { font-family: var(--font-mono); font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.04em; color: var(--text-secondary); }
.iconbutton {
  width: var(--layout-touch-min); height: var(--layout-touch-min); flex: none;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--bg-default); box-shadow: var(--shadow-soft);
  transition: background-color var(--ui-dur) ease-out, transform var(--press-dur) var(--ease-smooth-out);
}
.iconbutton:focus-visible { background: var(--bg-muted); }
.sheet-scroll { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--space-3) var(--space-3); }

/* Stop timeline (copied from prototype/destination-island, read-only here) */
.stops { padding: var(--space-2) 0 var(--space-1); }
.stop {
  position: relative; min-height: var(--layout-touch-min);
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
}
.rail { position: relative; align-self: stretch; width: var(--size-stop-dot-end); flex: none; display: grid; place-items: center; }
.rail::before {
  content: ""; position: absolute;
  top: calc(-1 * var(--space-2)); bottom: calc(-1 * var(--space-2));
  left: 50%; width: var(--size-timeline-line); transform: translateX(-50%);
  background: var(--rc);
}
.stop:first-child .rail::before { top: 50%; }
.stop:last-child .rail::before { bottom: 50%; }
.stop-dot { position: relative; width: var(--size-stop-dot); height: var(--size-stop-dot); border-radius: 50%; background: var(--rc); }
.stop-dot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; background: var(--bg-default); }
.stop.is-end .stop-dot { width: var(--size-stop-dot-end); height: var(--size-stop-dot-end); }
.stop.is-end .stop-dot::after { inset: 5px; }
.stop-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stop-name { font-size: 14px; line-height: 20px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stop.is-end .stop-name { font-weight: 600; }
.stop-note { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-secondary); }
.jeep {
  flex: none; height: 24px; padding: 0 var(--space-2);
  display: inline-flex; align-items: center; gap: var(--space-1);
  border-radius: var(--radius-pill); background: var(--rc-tint);
  font-family: var(--font-mono); font-size: 11px; line-height: 15px; font-weight: 500;
}
.jeep::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--rc); }

/* Press feedback (held at least --press-dur) */
.is-pressed { transform: scale(var(--press-scale)); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
  .is-pressed { transform: none; }
  .sheet { transform: none; opacity: 0; pointer-events: none; transition: opacity 150ms linear !important; }
  .phone[data-sheet="open"] .sheet { opacity: 1; pointer-events: auto; }
  .scrim { transition: opacity 150ms linear !important; }
}
</style>
</head>
<body>

<div class="phone" data-sheet="closed">
  <div id="map"></div>

  <div class="deck" id="deck" role="group" aria-label="Jeepneys, swipe to switch"></div>

  <nav class="nav" id="nav" aria-label="Main">
    <div class="nav-pill">
      <a class="tab" aria-label="Home" data-icon="home"></a>
      <a class="tab is-active" aria-current="page" data-icon="map">Map</a>
      <a class="tab" aria-label="Activity" data-icon="activity"></a>
      <a class="tab" aria-label="Profile" data-icon="user-circle"></a>
    </div>
    <button class="action" type="button" aria-label="Pick destination" data-icon="plus" data-press></button>
  </nav>

  <div class="scrim" id="scrim" aria-hidden="true"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" inert aria-hidden="true">
    <div class="handle"></div>
    <div class="sheet-head">
      <div class="sheet-title">
        <h2 id="sheet-title"></h2>
        <span class="mono-tag" id="sheet-meta"></span>
      </div>
      <button class="iconbutton" id="sheet-close" type="button" aria-label="Close" data-icon="x" data-press></button>
    </div>
    <div class="sheet-scroll"><div class="stops" id="sheet-stops"></div></div>
  </div>
</div>

  }
  if ('onscrollend' in window) deck.addEventListener('scrollend', cardFromScroll);
  else { var scrollTimer; deck.addEventListener('scroll', function () { clearTimeout(scrollTimer); scrollTimer = setTimeout(cardFromScroll, 120); }); }

  // Mouse users can drag the deck like a swipe (touch already scrolls natively)
  var dragStartX = 0, dragStartScroll = 0, dragging = false, dragged = false;
  deck.addEventListener('pointerdown', function (event) {
    if (event.pointerType !== 'mouse') return;
    dragging = true; dragged = false; dragStartX = event.clientX; dragStartScroll = deck.scrollLeft;
  });
  window.addEventListener('pointermove', function (event) {
    if (!dragging) return;
    var dx = event.clientX - dragStartX;
    if (Math.abs(dx) > 5) { dragged = true; deck.style.scrollSnapType = 'none'; }
    if (dragged) deck.scrollLeft = dragStartScroll - dx;
  });
  window.addEventListener('pointerup', function () {
    if (!dragging) return;
    dragging = false;
    if (!dragged) return;
    var target = Math.round(deck.scrollLeft / (cards[0].offsetWidth + 12));
    deck.style.scrollSnapType = '';
    select(Math.max(0, Math.min(cards.length - 1, target)), { scroll: true });
  });

  deck.addEventListener('click', function (event) {
    if (dragged) { dragged = false; return; }
    var card = event.target.closest('.card');
    if (!card) return;
    var i = Number(card.dataset.index);
    if (event.target.closest('.see-more')) { openSheet(i, event.target.closest('.see-more')); return; }
    select(i, { scroll: true });
  });

  // ---------------------------------------------------------------------
  // "See more" sheet: read-only stop timeline for the route
  // ---------------------------------------------------------------------
  var sheetFocusReturn = null;
  var inertWhileOpen = [document.getElementById('map'), deck, document.getElementById('nav')];
  function openSheet(i, trigger) {
    var route = ROUTES[i];
    var last = route.stops.length - 1;
    document.getElementById('sheet-title').textContent = route.from + ' → ' + route.to;
    document.getElementById('sheet-meta').textContent = route.code + ' · 1 LIVE';
    var list = document.getElementById('sheet-stops');
    list.dataset.route = route.id;
    list.innerHTML = route.stops.map(function (name, s) {
      var note = s === 0 ? 'First stop' : s === last ? 'Last stop' : '';
      var jeep = s === route.nextStop;       // the jeepney is heading to this stop
      return '<div class="stop' + (note ? ' is-end' : '') + '">' +
        '<span class="rail"><span class="stop-dot"></span></span>' +
        '<span class="stop-text"><span class="stop-name">' + name + '</span>' + (note ? '<span class="stop-note">' + note + '</span>' : '') + '</span>' +
        (jeep ? '<span class="jeep" aria-label="Jeepney ' + route.jeepId + ' arriving here, ' + route.etaMin.toLowerCase() + ' away">' + route.jeepId + ' · ' + route.etaMin + '</span>' : '') +
      '</div>';
    }).join('');
    sheetFocusReturn = trigger;
    select(i, { scroll: true });
    phone.dataset.sheet = 'open';
    sheet.inert = false;
    sheet.removeAttribute('aria-hidden');
    inertWhileOpen.forEach(function (el) { el.inert = true; });
    document.getElementById('sheet-close').focus({ preventScroll: true });
  }
  function closeSheet() {
    if (phone.dataset.sheet !== 'open') return;
    phone.dataset.sheet = 'closed';
    inertWhileOpen.forEach(function (el) { el.inert = false; });
    if (sheetFocusReturn) sheetFocusReturn.focus({ preventScroll: true });   // focus out before the sheet becomes inert
    sheet.inert = true;
    sheet.setAttribute('aria-hidden', 'true');
  }
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  document.getElementById('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') closeSheet(); });

  // ---------------------------------------------------------------------
  // Press feedback, held at least --press-dur so quick taps still show it
  // ---------------------------------------------------------------------
  var PRESS_MS = 150;
  document.addEventListener('pointerdown', function (event) {
    var el = event.target.closest('[data-press]');
    if (!el || reduceMotion.matches) return;
    var downAt = performance.now();
    el.classList.add('is-pressed');
    function release() {
      document.removeEventListener('pointerup', release);
      document.removeEventListener('pointercancel', release);
      setTimeout(function () { el.classList.remove('is-pressed'); }, Math.max(0, PRESS_MS - (performance.now() - downAt)));
    }
    document.addEventListener('pointerup', release);
    document.addEventListener('pointercancel', release);
  });
})();
</script>
</body>
</html>
