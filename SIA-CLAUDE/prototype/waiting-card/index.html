<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loc8 · Waiting card prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   Tokens. Names follow DESIGN.md. Raw values live only in this block.
   ========================================================================= */
:root {
  /* Color */
  --bg-default: #FFFFFF;
  --bg-app: #F1F1F2;
  --bg-subtle: #F7F8FA;
  --bg-muted: #F1F3F6;
  --bg-strong: #D3D8DF;
  --bg-mascot-band: #262B35;
  --text-primary: #0F1115;
  --text-secondary: #5F6877;
  --text-tertiary: #8A92A0;
  --text-inverse: #FFFFFF;
  --primary-default: #0A0A0A;
  --primary-pressed: #262B35;
  --status-live: #2E9E5B;
  --status-stale: #8A92A0;
  --route-1: #1F6FEB;   /* R1 · Bugasong */

  /* Spacing */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;

  /* Size */
  --layout-frame-width: 393px;
  --layout-touch-min: 44px;
  --size-home-content-w: 361px;
  --size-mascot-hero-h: 160px;
  --size-mascot-band-h: 84px;
  --size-dot-xs: 6px;
  --size-dot-sm: 8px;
  --size-icon-xs: 16px;
  --stroke-icon: 1.75;
  --stroke-check: 3;

  /* Radius */
  --radius-md: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  /* Elevation */
  --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.04);
  --shadow-raised: 0 8px 24px rgba(15, 17, 21, 0.10);

  /* Type */
  --font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* Motion (DESIGN.md 7 + NearestJeepney) */
  --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ui-dur: 200ms;
  --press-dur: 150ms;
  --press-scale: 0.97;
  --pulse-dur: 2000ms;
  --boarded-hold: 1000ms;      /* check stays visible before the card closes */
  --content-delay: 100ms;      /* content starts after the card begins to grow */

  /* transitions.dev: 01 Card resize */
  --resize-dur: 300ms;
  --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* 02 Number pop-in */
  --digit-dur: 600ms;
  --digit-exit-dur: 155ms;
  --digit-enter-delay: 50ms;
  --digit-stagger: 40ms;
  --digit-distance: 0.52em;
  --digit-exit-distance: 0.52em;
  --digit-blur: max(0.067em, 0.171em - 2.1px);
  --digit-lift: 0.125em;
  --digit-start-scale: 0.7;
  --digit-peak: 1.03;
  /* 04 Text states swap */
  --text-swap-dur: 150ms;
  --text-swap-translate-y: 4px;
  --text-swap-blur: 2px;
  --text-swap-ease: ease-in-out;
  /* 09 Icon swap */
  --icon-swap-dur: 250ms;
  --icon-swap-blur: 2px;
  --icon-swap-start-scale: 0.25;
  --icon-swap-ease: ease-in-out;
  /* 10 Success check */
  --check-opacity-dur: 500ms;
  --check-rotate-dur: 500ms;
  --check-rotate-from: 80deg;
  --check-bob-dur: 500ms;
  --check-y-amount: 40px;
  --check-blur-dur: 500ms;
  --check-blur-from: 10px;
  --check-path-dur: 500ms;
  --check-path-delay: 80ms;
  --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
  --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
  --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
  --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
  /* 18 Texts reveal */
  --stagger-dur: 500ms;
  --stagger-distance: 12px;
  --stagger-stagger: 40ms;
  --stagger-blur: 3px;
  --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* 34 Text swap soft */
  --text-soft-dur: 200ms;
  --text-soft-blur: 2px;
  --text-soft-ease: ease-in-out;
  --text-soft-resize-dur: 240ms;
  --text-soft-resize-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* 36 Number subtle change */
  --subtle-dur: 455ms;
  --subtle-distance: 0.14em;
  --subtle-blur: 0.042em;
  --subtle-ease: cubic-bezier(0.22, 1, 0.36, 1);
}

html, body { margin: 0; }
body {
  min-height: 100vh;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: var(--space-6);
  padding: var(--space-6);
  box-sizing: border-box;
  background: var(--bg-strong);
  font-family: var(--font-sans);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
p, h1, h2 { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
button:focus { outline: none; }

/* Type styles (DESIGN.md 3) */
.type-display  { font-size: 40px; line-height: 48px; font-weight: 800; }
.type-h3       { font-size: 18px; line-height: 26px; font-weight: 600; }
.type-body-lg  { font-size: 16px; line-height: 24px; font-weight: 500; }
.type-caption  { font-size: 12px; line-height: 16px; font-weight: 500; }
.type-greeting { font-size: 17px; line-height: 24px; font-weight: 600; }
.type-mono-tag { font-family: var(--font-mono); font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: 0.04em; }

/* =========================================================================
   Phone frame + Home placeholders (context only, not part of the card)
   ========================================================================= */
.phone {
  width: var(--layout-frame-width);
  background: var(--bg-app);
  box-shadow: var(--shadow-raised);
  padding-bottom: var(--space-6);
}
.greeting { padding: var(--space-5) var(--space-4) var(--space-3); }
.greeting .type-mono-tag { color: var(--text-secondary); }
.hero {
  position: relative;
  height: var(--size-mascot-hero-h);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}
.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: var(--size-mascot-band-h);
  background: var(--bg-mascot-band);
}
.hero span { position: relative; z-index: 1; transform: translateY(-40px); }
.column {
  width: var(--size-home-content-w);
  margin: var(--space-3) auto 0;
}
.placeholder {
  background: var(--bg-default);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.placeholder .bar { height: 48px; border-radius: var(--radius-md); background: var(--bg-muted); }

/* Buttons: Button/Primary + Button/Secondary, Small (40 tall, 44 hit area) */
.btn {
  position: relative;
  height: 40px;
  border-radius: var(--radius-pill);
  font-size: 16px; line-height: 24px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  transition:
    transform var(--press-dur) var(--ease-smooth-out),
    background-color var(--ui-dur) ease-out,
    color var(--ui-dur) ease-out;
}
.btn::before { content: ""; position: absolute; inset: -2px 0; } /* 44 px hit area */
.btn:active { transform: scale(var(--press-scale)); }
.btn-primary { background: var(--primary-default); color: var(--text-inverse); }
.btn-primary:focus-visible { background: var(--primary-pressed); }
.btn-secondary { background: var(--bg-muted); color: var(--text-primary); }
.btn-secondary:focus-visible { background: var(--bg-strong); }

/* =========================================================================
   Role/Commuter/WaitingCard
   ========================================================================= */
/* Wrapper owns the height tween and the 12 px gap to the next card,
   so the gap collapses together with the card. */
.wait-wrap { display: none; }
.wait-wrap.is-present { display: block; }
.wait-wrap.is-sizing { overflow: hidden; }
.wait-wrap { transition: opacity var(--resize-dur) var(--resize-ease); }
.wait-wrap.is-leaving { opacity: 0; }
.wait-inner { padding-bottom: var(--space-3); }

.wait-card {
  position: relative;
  background: var(--bg-default);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* Row 1: CardHeader (Tone=Live). The header button stretches over the
   whole card, so tapping anywhere opens the details. */
.card-head {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--layout-touch-min);
  margin: calc((var(--layout-touch-min) - 16px) / -2) 0; /* keep a 16 px row, 44 px hit area */
  text-align: left;
  width: 100%;
}
.card-head::after { content: ""; position: absolute; inset: 0; border-radius: var(--radius-xl); }
.card-head:focus-visible::after { background: rgba(15, 17, 21, 0.03); }
.card-head .title { flex: 1; color: var(--text-secondary); }
.card-head .meta { color: var(--text-secondary); /* not tertiary: freshness is essential info */ display: inline-flex; align-items: baseline; white-space: pre; }
.card-head .arrow { width: var(--size-icon-xs); height: var(--size-icon-xs); color: var(--text-tertiary); flex: none; }

/* Foundations/LivePulse: flat dot + flat translucent ring that fades out */
.live-dot {
  position: relative;
  width: var(--size-dot-xs);
  height: var(--size-dot-xs);
  border-radius: 50%;
  background: var(--status-live);
  flex: none;
  transition: background-color var(--text-soft-dur) var(--text-soft-ease);
}
.live-dot::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: inherit;
  animation: live-pulse var(--pulse-dur) var(--ease-smooth-out) infinite;
}
@keyframes live-pulse {
  0%       { transform: scale(1);   opacity: 0.5; }
  70%,100% { transform: scale(2.6); opacity: 0; }
}
.is-stale .live-dot { background: var(--status-stale); }
.is-stale .live-dot::after { animation: none; opacity: 0; }

/* Row 2: ETA (fixed 48 px row so "Arriving" doesn't change the card height) */
.eta { height: 48px; display: grid; align-items: center; }
.eta-face { grid-area: 1 / 1; display: flex; align-items: baseline; gap: var(--space-1); }
.eta-face[hidden] { display: none; }
.eta .unit { color: var(--text-secondary); white-space: pre; }

/* Row 3: trip (same shape as the island's From row) */
.trip {
  height: var(--layout-touch-min);
  box-sizing: border-box;
  background: var(--bg-subtle);
  border-radius: var(--radius-md);
  padding: 0 var(--space-3);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}
.route-dot { width: var(--size-dot-sm); height: var(--size-dot-sm); border-radius: 50%; background: var(--route-1); flex: none; }
.trip .stops { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* Row 4: I boarded (sits above the stretched header link) */
.board { position: relative; z-index: 1; width: 100%; }
.board[disabled] { cursor: default; }
.board .check { width: var(--size-icon-xs); height: var(--size-icon-xs); }
.board .check path { stroke: currentColor; stroke-width: var(--stroke-check); stroke-linecap: round; stroke-linejoin: round; fill: none; }

/* Toast (DESIGN.md 6.6) */
.toast {
  position: fixed;
  top: var(--space-5);
  left: 50%;
  transform: translate(-50%, -8px);
  background: var(--primary-default);
  color: var(--text-inverse);
  border-radius: var(--radius-pill);
  padding: var(--space-2) var(--space-4);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--ui-dur) ease-out, transform var(--ui-dur) ease-out;
}
.toast.is-shown { opacity: 1; transform: translate(-50%, 0); }

/* Demo controls (outside the phone) */
.controls {
  width: 260px;
  background: var(--bg-default);
  border-radius: var(--radius-xl);
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.controls h2 { margin-bottom: var(--space-1); }
.controls p { color: var(--text-secondary); }
.controls .btn { width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .btn, .wait-wrap, .live-dot, .toast { transition: none !important; }
  .btn:active { transform: none; }
  .live-dot::after { animation: none; opacity: 0; }
}

/* =========================================================================
   transitions.dev snippets, pasted as written
   ========================================================================= */
/* 01 Card resize */
.t-resize {
  transition:
    width  var(--resize-dur) var(--resize-ease),
    height var(--resize-dur) var(--resize-ease);
  will-change: width, height;
}
@media (prefers-reduced-motion: reduce) {
  .t-resize { transition: none !important; }
}

/* 02 Number pop-in */
.t-digit-group { display: inline-flex; align-items: baseline; }
.t-digit-slot { position: relative; display: inline-block; }
.t-digit-old { position: absolute; inset: 0; text-align: center; pointer-events: none; }
.t-digit { display: inline-block; will-change: transform, opacity, filter; }
.t-digit-group.is-animating .t-digit {
  animation: t-digit-in var(--digit-dur) linear both;
  animation-delay: calc(var(--digit-stagger) * var(--digit-i, 0) + var(--digit-enter-delay));
}
.t-digit-group.is-animating .t-digit-old {
  animation: t-digit-out var(--digit-exit-dur) linear both;
  animation-delay: calc(var(--digit-stagger) * var(--digit-i, 0));
}
.t-digit-group.is-animating [data-stagger="1"] { --digit-i: 1; }
.t-digit-group.is-animating [data-stagger="2"] { --digit-i: 2; }
.t-digit-group.is-animating .t-digit[data-same] { animation: none; }

@keyframes t-digit-in {
  0% { transform: translateY(calc(var(--digit-distance) * 1 + var(--digit-lift) * 0)) scale(var(--digit-start-scale)); opacity: 0; filter: blur(calc(var(--digit-blur) * 1)); }
  5% { transform: translateY(calc(var(--digit-distance) * 0.941 + var(--digit-lift) * 0.216)) scale(var(--digit-start-scale)); opacity: 0.059; filter: blur(calc(var(--digit-blur) * 1)); }
  10% { transform: translateY(calc(var(--digit-distance) * 0.755 + var(--digit-lift) * 0.648)) scale(var(--digit-start-scale)); opacity: 0.245; filter: blur(calc(var(--digit-blur) * 1)); }
  15% { transform: translateY(calc(var(--digit-distance) * 0.475 + var(--digit-lift) * 0.972)) scale(var(--digit-start-scale)); opacity: 0.525; filter: blur(calc(var(--digit-blur) * 1)); }
  20% { transform: translateY(calc(var(--digit-distance) * 0.206 + var(--digit-lift) * 0.792)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.792)); opacity: 0.794; filter: blur(calc(var(--digit-blur) * 0.9)); }
  25% { transform: translateY(calc(var(--digit-distance) * 0.041 + var(--digit-lift) * 0.392)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.392)); opacity: 0.959; filter: blur(calc(var(--digit-blur) * 0.75)); }
  30% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0.033)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.033)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.6)); }
  35% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * -0.194)) scale(calc(1 + (var(--digit-peak) - 1) * 0.711)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.45)); }
  40% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * -0.272)) scale(calc(1 + (var(--digit-peak) - 1) * 0.997)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.3)); }
  45% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * -0.238)) scale(calc(1 + (var(--digit-peak) - 1) * 0.87)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.15)); }
  50% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * -0.146)) scale(calc(1 + (var(--digit-peak) - 1) * 0.535)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  55% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * -0.05)) scale(calc(1 + (var(--digit-peak) - 1) * 0.183)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  60% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0.019)) scale(calc(1 + (var(--digit-peak) - 1) * -0.069)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  65% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0.05)) scale(calc(1 + (var(--digit-peak) - 1) * -0.185)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  70% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0.051)) scale(calc(1 + (var(--digit-peak) - 1) * -0.187)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  75% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0.035)) scale(calc(1 + (var(--digit-peak) - 1) * -0.128)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  80% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0.016)) scale(calc(1 + (var(--digit-peak) - 1) * -0.057)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  85% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0.002)) scale(calc(1 + (var(--digit-peak) - 1) * -0.007)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  90% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * -0.004)) scale(calc(1 + (var(--digit-peak) - 1) * 0.013)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  95% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * -0.003)) scale(calc(1 + (var(--digit-peak) - 1) * 0.011)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  100% { transform: translateY(calc(var(--digit-distance) * 0 + var(--digit-lift) * 0)) scale(1); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
}
@keyframes t-digit-out {
  0% { transform: translateY(calc(var(--digit-exit-distance) * 0)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0)); }
  10% { transform: translateY(calc(var(--digit-exit-distance) * -0.009)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.009)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.009)); }
  20% { transform: translateY(calc(var(--digit-exit-distance) * -0.042)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.042)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.042)); }
  30% { transform: translateY(calc(var(--digit-exit-distance) * -0.112)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.112)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.112)); }
  40% { transform: translateY(calc(var(--digit-exit-distance) * -0.252)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.252)); opacity: 1; filter: blur(calc(var(--digit-blur) * 0.252)); }
  50% { transform: translateY(calc(var(--digit-exit-distance) * -0.5)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.5)); opacity: 0.833; filter: blur(calc(var(--digit-blur) * 0.5)); }
  60% { transform: translateY(calc(var(--digit-exit-distance) * -0.748)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.748)); opacity: 0.42; filter: blur(calc(var(--digit-blur) * 0.748)); }
  70% { transform: translateY(calc(var(--digit-exit-distance) * -0.888)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.888)); opacity: 0.187; filter: blur(calc(var(--digit-blur) * 0.888)); }
  80% { transform: translateY(calc(var(--digit-exit-distance) * -0.958)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.958)); opacity: 0.069; filter: blur(calc(var(--digit-blur) * 0.958)); }
  90% { transform: translateY(calc(var(--digit-exit-distance) * -0.991)) scale(calc(1 + (var(--digit-start-scale) - 1) * 0.991)); opacity: 0.015; filter: blur(calc(var(--digit-blur) * 0.991)); }
  100% { transform: translateY(calc(var(--digit-exit-distance) * -1)) scale(calc(1 + (var(--digit-start-scale) - 1) * 1)); opacity: 0; filter: blur(calc(var(--digit-blur) * 1)); }
}
@media (prefers-reduced-motion: reduce) {
  .t-digit-group .t-digit { animation: none !important; }
  .t-digit-group .t-digit-old { display: none; }
}

/* 04 Text states swap */
.t-text-swap {
  display: inline-block;
  transform: translateY(0);
  filter: blur(0);
  opacity: 1;
  transition:
    transform var(--text-swap-dur) var(--text-swap-ease),
    filter    var(--text-swap-dur) var(--text-swap-ease),
    opacity   var(--text-swap-dur) var(--text-swap-ease);
  will-change: transform, filter, opacity;
}
.t-text-swap.is-exit {
  transform: translateY(calc(var(--text-swap-translate-y) * -1));
  filter: blur(var(--text-swap-blur));
  opacity: 0;
}
.t-text-swap.is-enter-start {
  transform: translateY(var(--text-swap-translate-y));
  filter: blur(var(--text-swap-blur));
  opacity: 0;
  transition: none;
}
@media (prefers-reduced-motion: reduce) {
  .t-text-swap { transition: none !important; }
}

/* 09 Icon swap */
.t-icon-swap {
  position: relative;
  display: inline-grid;
}
.t-icon-swap .t-icon {
  grid-area: 1 / 1;
  transition:
    opacity   var(--icon-swap-dur) var(--icon-swap-ease),
    filter    var(--icon-swap-dur) var(--icon-swap-ease),
    transform var(--icon-swap-dur) var(--icon-swap-ease);
}
.t-icon-swap[data-state="a"] .t-icon[data-icon="a"],
.t-icon-swap[data-state="b"] .t-icon[data-icon="b"] {
  opacity: 1;
  filter: blur(0);
  transform: scale(1);
}
.t-icon-swap[data-state="a"] .t-icon[data-icon="b"],
.t-icon-swap[data-state="b"] .t-icon[data-icon="a"] {
  opacity: 0;
  filter: blur(var(--icon-swap-blur));
  transform: scale(var(--icon-swap-start-scale));
}
@media (prefers-reduced-motion: reduce) {
  .t-icon-swap .t-icon { transition: none !important; }
}

/* 10 Success check */
.t-success-check {
  display: inline-block;
  transform-origin: center;
  opacity: 0;
  will-change: transform, opacity, filter;
}
.t-success-check svg { display: block; overflow: visible; }
.t-success-check svg path {
  stroke-dasharray: 20; /* replaced at runtime with getTotalLength() */
  stroke-dashoffset: 20;
}
.t-success-check[data-state="in"] {
  animation:
    t-check-fade   var(--check-opacity-dur) var(--check-ease-opacity) forwards,
    t-check-rotate var(--check-rotate-dur)  var(--check-ease-rotate)  forwards,
    t-check-blur   var(--check-blur-dur)    var(--check-ease-out)     forwards,
    t-check-bob    var(--check-bob-dur)     var(--check-ease-bob)     forwards;
}
.t-success-check[data-state="in"] svg path {
  animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
}
@keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes t-check-rotate {
  from { transform: rotate(var(--check-rotate-from)); }
  to   { transform: rotate(0deg); }
}
@keyframes t-check-blur {
  from { filter: blur(var(--check-blur-from)); }
  to   { filter: blur(0); }
}
@keyframes t-check-bob {
  from { translate: 0 var(--check-y-amount); }
  to   { translate: 0 0; }
}
@keyframes t-check-draw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .t-success-check { animation: none !important; opacity: 1; }
  .t-success-check svg path { animation: none !important; stroke-dashoffset: 0 !important; }
}

/* 18 Texts reveal (4 rows) */
.t-stagger-line {
  display: block;
  opacity: 0;
  transform: translateY(var(--stagger-distance));
  filter: blur(var(--stagger-blur));
  transition:
    opacity   var(--stagger-dur) var(--stagger-ease),
    transform var(--stagger-dur) var(--stagger-ease),
    filter    var(--stagger-dur) var(--stagger-ease);
  will-change: transform, opacity, filter;
}
.t-stagger-line--2 { transition-delay: var(--stagger-stagger); }
.t-stagger-line--3 { transition-delay: calc(var(--stagger-stagger) * 2); }
.t-stagger-line--4 { transition-delay: calc(var(--stagger-stagger) * 3); }
.t-stagger.is-shown .t-stagger-line {
  opacity: 1;
  transform: translateY(0);
  filter: blur(0);
}
.t-stagger.is-hiding .t-stagger-line {
  opacity: 0;
  transform: translateY(0);
  filter: blur(0);
  transition:
    opacity 200ms ease,
    transform 0s linear,
    filter 0s linear;
  transition-delay: 0s;
}
@media (prefers-reduced-motion: reduce) {
  .t-stagger-line { transition: none !important; }
}
/* Rows that are flex containers keep their own display after the reveal */
.wait-card .card-head.t-stagger-line,
.wait-card .trip.t-stagger-line,
.wait-card .board.t-stagger-line { display: flex; }
.wait-card .eta.t-stagger-line { display: grid; }

/* 34 Text swap soft */
.t-text-soft {
  display: inline-grid;
  justify-items: var(--text-soft-align, start);
  transition: width var(--text-soft-resize-dur) var(--text-soft-resize-ease);
}
.t-text-soft > span {
  grid-area: 1 / 1;
  white-space: pre;
  transition:
    filter  var(--text-soft-dur) var(--text-soft-ease),
    opacity var(--text-soft-dur) var(--text-soft-ease);
}
.t-text-soft-new {
  opacity: 0;
  filter: blur(var(--text-soft-blur));
}
.t-text-soft.is-swapping .t-text-soft-old {
  opacity: 0;
  filter: blur(var(--text-soft-blur));
}
.t-text-soft.is-swapping .t-text-soft-new {
  opacity: 1;
  filter: blur(0);
}
@media (prefers-reduced-motion: reduce) {
  .t-text-soft,
  .t-text-soft > span { transition: none !important; }
}

/* 36 Number subtle change */
.t-subtle-number {
  display: inline-flex;
  align-items: baseline;
  font-variant-numeric: tabular-nums;
}
.t-subtle-slot { position: relative; display: inline-block; }
.t-subtle-new { display: inline-block; }
.t-subtle-old { position: absolute; inset: 0; text-align: center; pointer-events: none; }
.t-subtle-number.is-animating .t-subtle-new {
  animation: t-subtle-in var(--subtle-dur) var(--subtle-ease) both;
}
.t-subtle-number.is-animating .t-subtle-old {
  animation: t-subtle-out var(--subtle-dur) var(--subtle-ease) both;
}
@keyframes t-subtle-in {
  from {
    transform: translateY(calc(var(--subtle-distance) * var(--subtle-dir, 1)));
    opacity: 0;
    filter: blur(var(--subtle-blur));
  }
}
@keyframes t-subtle-out {
  to {
    transform: translateY(calc(var(--subtle-distance) * var(--subtle-dir, 1) * -1));
    opacity: 0;
    filter: blur(var(--subtle-blur));
  }
}
@media (prefers-reduced-motion: reduce) {
  .t-subtle-number .t-subtle-new { animation: none !important; }
  .t-subtle-number .t-subtle-old { display: none; }
}
</style>
</head>
<body>

<main class="phone" aria-label="Commuter Home (context)">
  <div class="greeting">
    <p class="type-mono-tag">TODAY, 15 NOVEMBER</p>
    <h1 class="type-greeting">Good morning, Ana</h1>
  </div>
  <div class="hero"><span class="type-caption">Mascot hero (placeholder)</span></div>

  <div class="column">
    <!-- Role/Commuter/WaitingCard -->
    <div class="wait-wrap t-resize" id="waitWrap">
      <div class="wait-inner">
        <article class="wait-card t-stagger" id="waitCard" aria-label="Waiting card">
          <button class="card-head t-stagger-line t-stagger-line--1" id="cardLink" type="button">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="title type-caption">Waiting for J-014</span>
            <span class="meta type-mono-tag" aria-hidden="true"><span class="t-text-soft" id="metaLabel">LIVE</span> · <span class="t-subtle-number" id="metaNum">0</span><span class="t-text-soft" id="metaUnit">S</span></span>
            <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>

          <div class="eta t-stagger-line t-stagger-line--2" aria-live="polite">
            <div class="t-text-swap" id="etaSwap">
              <span class="eta-face" id="etaValue">
                <span class="t-digit-group type-display" id="etaDigits">6</span>
                <span class="unit type-mono-tag t-text-soft" id="etaUnit">MIN</span>
              </span>
              <span class="eta-face type-h3" id="etaArriving" hidden>Arriving</span>
            </div>
          </div>

          <div class="trip t-stagger-line t-stagger-line--3">
            <span class="route-dot" aria-hidden="true"></span>
            <span class="stops type-caption">Bugasong · Public Market → San Jose · Market Stop</span>
          </div>

          <button class="btn btn-primary board t-stagger-line t-stagger-line--4" id="boardBtn" type="button">
            <span class="t-icon-swap" id="boardSwap" data-state="a">
              <span class="t-icon" data-icon="a">I boarded</span>
              <span class="t-icon" data-icon="b">
                <span class="t-success-check check" id="boardCheck" data-state="out" aria-hidden="true">
                  <svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>
                </span>
              </span>
            </span>
          </button>
        </article>
      </div>
    </div>

    <!-- Context: Nearest jeepney (placeholder). Its button turns secondary while
         waiting, so Home keeps one black button (open decision 1, option a). -->
    <section class="placeholder" aria-label="Nearest jeepney (placeholder)">
      <span class="type-caption">Nearest jeepney (placeholder)</span>
      <div class="bar"></div>
      <button class="btn btn-primary" id="trackBtn" type="button">Track Jeepney</button>
    </section>
    <section class="placeholder" aria-label="Fares (placeholder)">
      <span class="type-caption">Fares (placeholder)</span>
      <div class="bar"></div>
    </section>
  </div>
</main>

<aside class="controls" aria-label="Demo controls">
  <h2 class="type-h3">Demo controls</h2>
  <p class="type-caption">Not part of the design. Time runs fast: 1 ETA minute = 3 s.</p>
  <button class="btn btn-secondary" id="startBtn" type="button">Start waiting</button>
  <button class="btn btn-secondary" id="staleBtn" type="button">Go stale</button>
  <button class="btn btn-secondary" id="arriveBtn" type="button">Jump to Arriving</button>
</aside>

<div class="toast type-caption" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const ms = (name) =>
  parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || 0;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

const wrap = $("waitWrap"), card = $("waitCard");
const etaSwapEl = $("etaSwap"), etaValue = $("etaValue"), etaArriving = $("etaArriving");
const etaDigits = $("etaDigits"), etaUnit = $("etaUnit");
const metaLabel = $("metaLabel"), metaNum = $("metaNum"), metaUnit = $("metaUnit");
const boardBtn = $("boardBtn"), boardSwap = $("boardSwap"), boardCheck = $("boardCheck");
const trackBtn = $("trackBtn"), staleBtn = $("staleBtn"), startBtn = $("startBtn");

// Demo data (placeholder values, same as the other prototypes)
const ETA_START = 6;
const ETA_TICK_MS = 3000;    // demo: one ETA minute every 3 s
const FIX_EVERY_S = 5;       // demo: a new GPS fix resets the "seconds ago" counter
const STALE_MINUTES = 2;

let waiting = false, stale = false, arriving = false;
let eta = ETA_START, secs = 0;
let etaTimer = null, secTimer = null;

/* ---------- 02 Number pop-in (orchestration from the skill, scoped to one group) */
let etaCurrent = etaDigits.textContent.trim();
function setDigits(str) {
  let same = 0;
  while (same < etaCurrent.length && same < str.length && etaCurrent[same] === str[same]) same++;
  etaDigits.classList.remove("is-animating");
  etaDigits.replaceChildren();
  [...str].forEach((ch, i) => {
    const fresh = document.createElement("span");
    fresh.className = "t-digit";
    fresh.textContent = ch;
    if (i < same || !/\d/.test(ch)) {
      fresh.dataset.same = "";
      etaDigits.appendChild(fresh);
      return;
    }
    const slot = document.createElement("span");
    slot.className = "t-digit-slot";
    const fromEnd = str.length - 1 - i;
    if (fromEnd === 1) slot.dataset.stagger = "1";
    else if (fromEnd === 0) slot.dataset.stagger = "2";
    const oldCh = etaCurrent[etaCurrent.length - (str.length - i)];
    if (oldCh && /\d/.test(oldCh)) {
      const old = document.createElement("span");
      old.className = "t-digit-old";
      old.setAttribute("aria-hidden", "true");
      old.textContent = oldCh;
      slot.appendChild(old);
    }
    slot.appendChild(fresh);
    etaDigits.appendChild(slot);
  });
  etaCurrent = str;
  void etaDigits.offsetHeight; // force reflow
  etaDigits.classList.add("is-animating");
}

/* ---------- 04 Text states swap: "6 MIN" <-> "Arriving" (faces swap instead of textContent) */
function swapEtaFace(showArriving) {
  const dur = ms("--text-swap-dur");
  etaSwapEl.classList.add("is-exit");
  setTimeout(() => {
    etaValue.hidden = showArriving;
    etaArriving.hidden = !showArriving;
    etaSwapEl.classList.remove("is-exit");
    etaSwapEl.classList.add("is-enter-start");
    void etaSwapEl.offsetHeight; // force reflow so the next change transitions
    etaSwapEl.classList.remove("is-enter-start");
  }, dur);
}

/* ---------- 34 Text swap soft (from the skill) */
function softSwap(el, next) {
  const prev = el.dataset.text ?? el.textContent;
  if (prev === next) return;
  el.dataset.text = next;
  clearTimeout(el._softTimer);

  const out = document.createElement("span");
  out.className = "t-text-soft-old";
  out.setAttribute("aria-hidden", "true");
  out.textContent = prev;
  const inn = document.createElement("span");
  inn.className = "t-text-soft-new";
  inn.textContent = next;

  const w0 = el.getBoundingClientRect().width;
  el.classList.remove("is-swapping");
  el.replaceChildren(out, inn);
  const w1 = inn.getBoundingClientRect().width;
  el.style.width = w0 + "px";
  void el.offsetWidth; // force reflow so every transition runs
  el.classList.add("is-swapping");
  el.style.width = w1 + "px";

  el._softTimer = setTimeout(() => {
    el.classList.remove("is-swapping");
    el.style.removeProperty("width");
    el.textContent = next;
  }, Math.max(ms("--text-soft-dur"), ms("--text-soft-resize-dur")) + 40);
}

/* ---------- 36 Number subtle change (from the skill, plain integers) */
let metaValue = 0;
function setMetaNumber(next) {
  const prev = String(metaValue);
  const str = String(next);
  const sameLength = prev.length === str.length;
  metaNum.style.setProperty("--subtle-dir", next >= metaValue ? "1" : "-1");
  metaNum.classList.remove("is-animating");
  metaNum.replaceChildren();
  [...str].forEach((ch, i) => {
    if (sameLength && prev[i] === ch) { metaNum.append(ch); return; }
    const slot = document.createElement("span");
    slot.className = "t-subtle-slot";
    if (sameLength) {
      const old = document.createElement("span");
      old.className = "t-subtle-old";
      old.setAttribute("aria-hidden", "true");
      old.textContent = prev[i];
      slot.appendChild(old);
    }
    const fresh = document.createElement("span");
    fresh.className = "t-subtle-new";
    fresh.textContent = ch;
    slot.appendChild(fresh);
    metaNum.appendChild(slot);
  });
  metaValue = next;
  void metaNum.offsetHeight; // force reflow
  metaNum.classList.add("is-animating");
}

/* ---------- Accessible label for the stretched header button */
function updateLabel() {
  const when = arriving ? "arriving now" : `${eta} minutes away`;
  const fresh = stale ? `location stale, last update ${STALE_MINUTES} minutes ago` : "live location";
  $("cardLink").setAttribute("aria-label", `Waiting for J-014, ${when}, ${fresh}. Opens waiting details`);
}

/* ---------- Timers */
function startTimers() {
  stopTimers();
  etaTimer = setInterval(() => {
    if (stale || arriving) return;
    if (eta <= 1) { setArriving(); return; }
    eta -= 1;
    setDigits(String(eta));
    updateLabel();
  }, ETA_TICK_MS);
  secTimer = setInterval(() => {
    if (stale) return;
    secs = secs >= FIX_EVERY_S ? 0 : secs + 1;
    setMetaNumber(secs);
  }, 1000);
}
function stopTimers() { clearInterval(etaTimer); clearInterval(secTimer); }

function setArriving() {
  if (arriving) return;
  arriving = true;
  swapEtaFace(true);
  updateLabel();
}

/* ---------- Stale <-> live */
function setStale(next) {
  stale = next;
  card.classList.toggle("is-stale", stale);
  softSwap(metaLabel, stale ? "STALE" : "LIVE");
  softSwap(metaUnit, stale ? " MIN AGO" : "S");
  softSwap(etaUnit, stale ? "MIN · LAST KNOWN" : "MIN");
  secs = 0;
  setMetaNumber(stale ? STALE_MINUTES : 0);
  staleBtn.textContent = stale ? "Go live" : "Go stale";
  updateLabel();
}

/* ---------- Reset the card to its starting state (no animation) */
function resetCard() {
  eta = ETA_START; secs = 0; stale = false; arriving = false;
  etaCurrent = String(ETA_START);
  etaDigits.classList.remove("is-animating");
  etaDigits.textContent = etaCurrent;
  etaValue.hidden = false; etaArriving.hidden = true;
  [metaLabel, metaUnit, etaUnit].forEach((el) => delete el.dataset.text);
  metaLabel.textContent = "LIVE"; metaUnit.textContent = "S"; etaUnit.textContent = "MIN";
  metaValue = 0; metaNum.classList.remove("is-animating"); metaNum.textContent = "0";
  card.classList.remove("is-stale");
  staleBtn.textContent = "Go stale";
  boardBtn.disabled = false;
  boardSwap.dataset.state = "a";
  boardCheck.dataset.state = "out";
  updateLabel();
}

/* ---------- 01 Card resize: open (height 0 -> content height) + 18 Texts reveal */
function openCard() {
  if (waiting) return;
  waiting = true;
  resetCard();
  setTrackSecondary(true);
  startBtn.disabled = true;

  card.classList.remove("is-shown", "is-hiding");
  wrap.classList.remove("is-leaving");
  wrap.classList.add("is-present", "is-sizing");
  const target = wrap.scrollHeight;
  wrap.style.height = "0px";
  void wrap.offsetHeight; // force reflow so the height tweens
  wrap.style.height = target + "px";

  setTimeout(() => {
    void card.offsetHeight;
    card.classList.add("is-shown");
  }, reduceMotion.matches ? 0 : ms("--content-delay"));

  setTimeout(() => {
    wrap.style.removeProperty("height");   // back to natural height
    wrap.classList.remove("is-sizing");    // stop clipping the card shadow
  }, reduceMotion.matches ? 0 : ms("--resize-dur"));

  startTimers();
}

/* ---------- 01 Card resize: close (content height -> 0) */
function closeCard() {
  stopTimers();
  wrap.classList.add("is-sizing");
  wrap.style.height = wrap.offsetHeight + "px";
  void wrap.offsetHeight;
  wrap.classList.add("is-leaving");
  wrap.style.height = "0px";

  setTimeout(() => {
    wrap.classList.remove("is-present", "is-sizing", "is-leaving");
    wrap.style.removeProperty("height");
    card.classList.remove("is-shown");
    waiting = false;
    setTrackSecondary(false);
    startBtn.disabled = false;
    showToast("Boarded. Rating comes next (open decision 2).");
  }, reduceMotion.matches ? 0 : ms("--resize-dur"));
}

/* ---------- I boarded: 09 Icon swap + 10 Success check, hold, then close */
const checkPath = boardCheck.querySelector("path");
const checkLen = String(Math.ceil(checkPath.getTotalLength()) + 1);
checkPath.style.strokeDasharray = checkLen;
checkPath.style.strokeDashoffset = checkLen;

boardBtn.addEventListener("click", () => {
  if (boardBtn.disabled) return;
  boardBtn.disabled = true;
  boardBtn.setAttribute("aria-label", "Boarded");
  stopTimers();
  boardSwap.dataset.state = "b";
  boardCheck.dataset.state = "out";
  void boardCheck.offsetWidth; // force reflow so keyframes restart
  boardCheck.dataset.state = "in";
  const settle = reduceMotion.matches ? 0 : ms("--check-path-delay") + ms("--check-path-dur");
  setTimeout(closeCard, settle + ms("--boarded-hold"));
});

/* ---------- Nearest jeepney button: secondary while waiting */
function setTrackSecondary(on) {
  trackBtn.classList.toggle("btn-primary", !on);
  trackBtn.classList.toggle("btn-secondary", on);
}

/* ---------- Toast */
let toastTimer;
function showToast(text) {
  const toast = $("toast");
  toast.textContent = text;
  toast.classList.add("is-shown");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("is-shown"), 3000);
}

$("cardLink").addEventListener("click", () => showToast("Opens waiting details (not in this prototype)."));
startBtn.addEventListener("click", openCard);
staleBtn.addEventListener("click", () => { if (waiting) setStale(!stale); });
$("arriveBtn").addEventListener("click", () => { if (waiting && !stale) setArriving(); });

// Show the card shortly after load so the entrance is visible.
setTimeout(openCard, 400);
</script>
</body>
</html>
